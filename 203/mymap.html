<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Interactive Experience</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Plus Jakarta Sans', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e5e3df;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 🔍 Search Floating Panel (Top-Left) */
        .search-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 380px;
            max-width: calc(100vw - 40px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 8px 12px 8px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .search-card input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
            color: #202124;
            background: transparent;
        }

        .btn-search {
            background: linear-gradient(135deg, #1a73e8, #1557b0);
            color: #ffffff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .btn-search:hover {
            transform: scale(1.05);
        }

        /* 🏷️ Quick Filter Chips */
        .chips-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .chips-container::-webkit-scrollbar {
            display: none;
        }

        .chip-btn {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(218, 220, 224, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #1a73e8;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip-btn:hover {
            background: #1a73e8;
            color: #ffffff;
            border-color: #1a73e8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(26, 115, 232, 0.3);
        }

        .chip-btn i {
            color: inherit;
        }

        /* 🎛️ Control Panel (Top-Right) */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fab-btn {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3c4043;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        .fab-btn:hover {
            background: #ffffff;
            color: #1a73e8;
            transform: translateY(-2px);
        }

        /* 📍 Custom Google InfoWindow Popup */
        .gm-style-iw-c {
            padding: 0 !important;
            border-radius: 20px !important;
            box-shadow: 0 12px 32px rgba(0,0,0,0.25) !important;
        }

        .gm-style-iw-d {
            overflow: hidden !important;
        }

        .info-card {
            width: 270px;
            text-align: left;
        }

        .info-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .info-card-content {
            padding: 14px;
        }

        .info-card h3 {
            font-size: 1rem;
            color: #202124;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .info-card p {
            font-size: 0.82rem;
            color: #5f6368;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .btn-open-browser {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 0;
            background: linear-gradient(135deg, #1a73e8, #1557b0);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
            transition: background 0.2s;
        }

        .btn-open-browser:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>

    <!-- Floating Search & Filter Bar -->
    <div class="search-panel">
        <div class="search-card">
            <i class="fa-solid fa-location-dot" style="color: #1a73e8; font-size: 1.1rem;"></i>
            <input type="text" id="searchInput" placeholder="ค้นหาจุดหมายปลายทาง..." onkeypress="handleKeyPress(event)">
            <button class="btn-search" title="ค้นหา" onclick="searchLocation()">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <div class="chips-container" id="chipsContainer"></div>
    </div>

    <!-- Floating Map Control Buttons -->
    <div class="control-panel">
        <button class="fab-btn" title="สลับโหมดแผนที่ (ดาวเทียม/แผนที่)" onclick="toggleMapType()">
            <i class="fa-solid fa-layer-group"></i>
        </button>
        <button class="fab-btn" title="แสดงพื้นที่ทั้งหมด" onclick="fitAllMarkers()">
            <i class="fa-solid fa-compress"></i>
        </button>
    </div>

    <!-- Google Map Window -->
    <div id="map"></div>

    <!-- Google Maps API Script Integration -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC5l0aPyGFqiqY5DpqOYf-8YhN_eYHHobU&libraries=places&callback=initMap&v=weekly" async defer></script>

    <script>
        let map;
        let service;
        let infoWindow;
        let markers = [];
        let isSatellite = false;

        // 📍 พิกัด 2 จุดเริ่มต้นที่ต้องการแสดง
        const defaultPlaces = [
            {
                name: "สยามพารากอน (Siam Paragon)",
                pos: { lat: 13.7460, lng: 100.5347 },
                desc: "ศูนย์การค้าระดับโลกใจกลางกรุงเทพมหานคร",
                icon: "fa-bag-shopping",
                img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=500&q=80"
            },
            {
                name: "วัดอรุณราชวราราม",
                pos: { lat: 13.7437, lng: 100.4888 },
                desc: "พระอารามหลวงชั้นเอก โบราณสถานสำคัญริมแม่น้ำเจ้าพระยา",
                icon: "fa-gopuram",
                img: "https://images.unsplash.com/photo-1508009603885-50cf7c579365?auto=format&fit=crop&w=500&q=80"
            }
        ];

        function initMap() {
            // ตั้งค่าเริ่มต้นของ Google Maps
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 13,
                center: defaultPlaces[0].pos,
                mapTypeId: 'roadmap',
                disableDefaultUI: true, // ปิดปุ่มควบคุมมาตรฐานเพื่อใช้ UI แบบ Custom
                zoomControl: true,
                zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_BOTTOM }
            });

            infoWindow = new google.maps.InfoWindow();
            service = new google.maps.places.PlacesService(map);

            renderChips();
            
            // สร้างหมุดปักบนแผนที่
            defaultPlaces.forEach((place, index) => {
                addCustomMarker(place, index);
            });

            fitAllMarkers();

            // 🖱️ คลิกตรงไหนบนแผนที่ Google Maps ก็ได้เพื่อดึงพิกัด
            map.addListener("click", (e) => {
                const lat = e.latLng.lat().toFixed(4);
                const lng = e.latLng.lng().toFixed(4);
                const contentString = `
                    <div class="info-card-content" style="text-align: center;">
                        <h3 style="margin-bottom: 4px;">📍 ตำแหน่งที่คุณคลิก</h3>
                        <p style="margin-bottom: 10px;">พิกัด: ${lat}, ${lng}</p>
                        <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank" class="btn-open-browser">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> เปิดใน Google Maps
                        </a>
                    </div>
                `;
                infoWindow.setContent(contentString);
                infoWindow.setPosition(e.latLng);
                infoWindow.open(map);
            });
        }

        // สร้างหมุด Custom Marker บน Google Maps
        function addCustomMarker(place, index) {
            const marker = new google.maps.Marker({
                position: place.pos,
                map: map,
                title: place.name,
                animation: google.maps.Animation.DROP
            });

            markers.push(marker);

            const mapsBrowserUrl = `https://www.google.com/maps/search/?api=1&query=${place.pos.lat},${place.pos.lng}`;

            marker.addListener("click", () => {
                const contentString = `
                    <div class="info-card">
                        ${place.img ? `<img src="${place.img}" alt="${place.name}">` : ''}
                        <div class="info-card-content">
                            <h3>${place.name}</h3>
                            <p>${place.desc}</p>
                            <a href="${mapsBrowserUrl}" target="_blank" class="btn-open-browser">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> เปิดใน Google Maps
                            </a>
                        </div>
                    </div>
                `;
                infoWindow.setContent(contentString);
                infoWindow.open(map, marker);
                map.panTo(place.pos);
            });
        }

        // สร้างปุ่มทางลัด (Chips) สำหรับกดวาร์ป
        function renderChips() {
            const container = document.getElementById('chipsContainer');
            container.innerHTML = '';
            defaultPlaces.forEach((place, index) => {
                const btn = document.createElement('button');
                btn.className = 'chip-btn';
                btn.innerHTML = `<i class="fa-solid ${place.icon || 'fa-location-dot'}"></i> ${place.name.split(' ')[0]}`;
                btn.onclick = () => focusPlace(index);
                container.appendChild(btn);
            });
        }

        function focusPlace(index) {
            map.setZoom(16);
            google.maps.event.trigger(markers[index], 'click');
        }

        // ปรับมุมมองให้ครอบคลุมพิกัดหมุดทั้งหมด
        function fitAllMarkers() {
            const bounds = new google.maps.LatLngBounds();
            markers.forEach(marker => bounds.extend(marker.getPosition()));
            map.fitBounds(bounds);
        }

        // สลับประเภทแผนที่ (Roadmap / Hybrid Satellite)
        function toggleMapType() {
            if (isSatellite) {
                map.setMapTypeId('roadmap');
            } else {
                map.setMapTypeId('hybrid');
            }
            isSatellite = !isSatellite;
        }

        // ค้นหาตำแหน่งโดยใช้ Google Places API
        function searchLocation() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            const request = {
                query: query,
                fields: ['name', 'geometry', 'formatted_address', 'photos']
            };

            service.textSearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK && results[0]) {
                    const place = results[0];
                    let photoUrl = "";
                    
                    if (place.photos && place.photos.length > 0) {
                        photoUrl = place.photos[0].getUrl({ maxWidth: 400 });
                    }

                    const newLocation = {
                        name: place.name,
                        pos: place.geometry.location,
                        desc: place.formatted_address,
                        icon: "fa-map-pin",
                        img: photoUrl
                    };

                    defaultPlaces.push(newLocation);
                    const newIndex = defaultPlaces.length - 1;
                    
                    addCustomMarker(newLocation, newIndex);
                    renderChips();
                    focusPlace(newIndex);
                } else {
                    alert('ไม่พบสถานที่ตามคำค้นหานี้');
                }
            });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchLocation();
            }
        }
    </script>
</body>
</html>
